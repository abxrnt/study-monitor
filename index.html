<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Planner</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, system-ui
    }

    html,
    body {
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #f7f7f7;
      color: #111;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR */
    .navbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 8px 14px;
      font-size: 12px;
    }

    .title {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: #f1f1f1;
      color: #444;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .tab.active {
      background: #111;
      color: #fff;
    }

    .tab small {
      font-size: 10px;
      opacity: .7;
    }

    .stats {
      display: flex;
      gap: 10px;
      font-weight: 600;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #444;
    }

    .add-btn {
      margin-left: 10px;
      background: #111;
      color: #fff;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* MAIN LAYOUT (IMPORTANT FIX) */
    .main {
      flex: 1;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      overflow: hidden;
      /* ❗ prevents page scroll */
    }

    .panel {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      /* ❗ CRITICAL */
    }

    .panel-header {
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      /* ✅ only this scrolls */
      min-height: 0;
      /* ❗ CRITICAL */
    }

    /* CHAPTER */
    .chapter {
      padding: 8px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .chapter-name {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      font-size: 10px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #555;
    }

    .check input {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #bbb;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .check input:checked {
      background: #111;
      border-color: #111;
    }

    .check input:checked::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 4px;
      width: 3px;
      height: 6px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* LOGIN (unchanged) */
    .auth {
      position: fixed;
      inset: 0;
      background: #f7f7f7;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      z-index: 9999;
    }

    .auth-left {
      padding: 40px;
      overflow: auto;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .user-card {
      padding: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    .user-card.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .auth-right {
      background: #fff;
      border-left: 1px solid #e5e5e5;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .auth-box input {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .auth-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .msg {
      font-size: 11px;
      color: #d00;
      min-height: 14px;
    }

    .msg.ok {
      color: #0a7;
    }

    /* LEVEL BADGE */
    .level {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      box-shadow: 0 0 6px currentColor;
    }

    .level.easy {
      color: #0a7;
      background: rgba(0, 170, 120, .15);
    }

    .level.medium {
      color: #d9a400;
      background: rgba(255, 200, 0, .18);
    }

    .level.hard {
      color: #d33;
      background: rgba(220, 60, 60, .18);
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div class="auth" id="auth">
    <div class="auth-left">
      <h2>Select User</h2>
      <div class="user-grid" id="userGrid"></div>
    </div>
    <div class="auth-right">
      <div class="auth-box">
        <h3 id="loginTitle">Login</h3>
        <input id="loginPass" type="password" placeholder="Password" disabled>
        <button class="auth-btn" id="loginBtn" disabled onclick="login()">Login</button>
        <div class="msg" id="loginMsg"></div>
      </div>
      <div class="auth-box">
        <h3>New Registration</h3>
        <input id="regUser" placeholder="Username">
        <input id="regPass" type="password" placeholder="Password">
        <button class="auth-btn" onclick="register()">Register</button>
        <div class="msg" id="regMsg"></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div class="app">
    <div class="navbar">
      <div class="title"><i data-lucide="layout-grid"></i>Study Planner</div>

      <div class="tabs">
        <div class="tab active" data-sub="p"><i data-lucide="zap"></i>Physics</div>
        <div class="tab" data-sub="m"><i data-lucide="calculator"></i>Maths</div>
        <div class="tab" data-sub="pc"><i data-lucide="flask-conical"></i>Physical</div>
        <div class="tab" data-sub="oc"><i data-lucide="leaf"></i>Organic</div>
        <div class="tab" data-sub="ic"><i data-lucide="atom"></i>Inorganic</div>
      </div>

      <div style="display:flex;align-items:center">
        <div class="stats">
          <div class="stat"><i data-lucide="check"></i><span id="doneCount">0</span></div>
          <div class="stat"><i data-lucide="loader"></i><span id="progressCount">0</span></div>
          <div class="stat"><i data-lucide="x"></i><span id="todoCount">0</span></div>
        </div>
        <div class="add-btn" onclick="logout()"><i data-lucide="log-out"></i></div>
      </div>
    </div>

    <div class="main">
      <div class="panel">
        <div class="panel-header"><i data-lucide="x-circle"></i>Incomplete</div>
        <div class="panel-body" id="incomplete"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><i data-lucide="loader"></i>In Progress</div>
        <div class="panel-body" id="progress"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><i data-lucide="check-circle"></i>Completed</div>
        <div class="panel-body" id="complete"></div>
      </div>
    </div>
  </div>

  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyC4p3HnfZ0_e-8ghcHYo1FG4u-ywfGv3L8",
      authDomain: "study-b5df9.firebaseapp.com",
      projectId: "study-b5df9"
    });
    const db = firebase.firestore();

    let subject = "p";
    let currentUser = null;

    /* USERS */
    db.collection("users").get().then(s => {
      s.forEach(doc => {
        const c = document.createElement("div");
        c.className = "user-card";
        c.textContent = doc.data().username;
        c.onclick = () => {
          document.querySelectorAll(".user-card").forEach(x => x.classList.remove("active"));
          c.classList.add("active");
          currentUser = { id: doc.id, ...doc.data() };
          loginTitle.textContent = "Login as " + currentUser.username;
          loginPass.disabled = false;
          loginBtn.disabled = false;
        };
        userGrid.appendChild(c);
      });
    });

    function login() {
      loginMsg.textContent = "";
      if (loginPass.value !== currentUser.password) {
        loginMsg.textContent = "Wrong password";
        return;
      }
      localStorage.user = currentUser.id;
      auth.style.display = "none";
      render();
    }

    function register() {
      regMsg.textContent = "";
      if (!regUser.value || !regPass.value) {
        regMsg.textContent = "Fill all fields";
        return;
      }
      db.collection("users").add({ username: regUser.value, password: regPass.value })
        .then(() => { regMsg.textContent = "Registered. Reloading…"; regMsg.className = "msg ok"; setTimeout(() => location.reload(), 800) });
    }

    function logout() { localStorage.clear(); location.reload(); }

    /* RENDER + PROGRESS % */
    function render() {
      incomplete.innerHTML = ""; progress.innerHTML = ""; complete.innerHTML = "";
      let done = 0, prog = 0, todo = 0;

      db.collection("chapters").where("sub", "==", subject).get().then(chs => {
        let totalCh = chs.size;
        chs.forEach(ch => {
          db.collection("users").doc(localStorage.user)
            .collection("progress").doc(ch.id).get().then(p => {
              const d = p.exists ? p.data() : {};
              const state = { lecture: !!d.lecture, concept: !!d.concept, pyqs: !!d.pyqs, rev1: !!d.rev1, rev2: !!d.rev2 };
              const cnt = Object.values(state).filter(Boolean).length;

              const row = document.createElement("div");
              row.className = "chapter";
              row.innerHTML = `
<div class="chapter-name" style="display:flex;justify-content:space-between;align-items:center">
  <span>${ch.data().nm}</span>
  <span class="level ${ch.data().lvl}">${ch.data().lvl}</span>
</div>
            <div class="checks">
              ${Object.keys(state).map((k, i) => `
                <label class="check">
                  <input type="checkbox" ${state[k] ? "checked" : ""}>
                  ${["Lecture", "Concept", "PYQs", "Rev1", "Rev2"][i]}
                </label>`).join("")}
            </div>`;
              row.querySelectorAll("input").forEach((cb, i) => {
                cb.onchange = () => {
                  const keys = ["lecture", "concept", "pyqs", "rev1", "rev2"];
                  state[keys[i]] = cb.checked;
                  db.collection("users").doc(localStorage.user)
                    .collection("progress").doc(ch.id)
                    .set(state, { merge: true }).then(render);
                };
              });

              if (cnt === 0) { todo++; incomplete.appendChild(row) }
              else if (cnt === 5) { done++; complete.appendChild(row) }
              else { prog++; progress.appendChild(row) }

              doneCount.textContent = done;
              progressCount.textContent = prog;
              todoCount.textContent = todo;
            });
        });
      });

      calcAllProgress();
    }

    function calcAllProgress() {
      ["p", "m", "pc", "oc", "ic"].forEach(sub => {
        db.collection("chapters").where("sub", "==", sub).get().then(chs => {
          let total = chs.size * 5, done = 0, pending = chs.size;
          if (total === 0) { updateTab(sub, 0); return; }
          chs.forEach(ch => {
            db.collection("users").doc(localStorage.user)
              .collection("progress").doc(ch.id).get().then(p => {
                if (p.exists) {
                  done += ["lecture", "concept", "pyqs", "rev1", "rev2"].filter(k => p.data()[k]).length;
                }
                pending--;
                if (pending === 0) {
                  updateTab(sub, Math.round(done / total * 100));
                }
              });
          });
        });
      });
    }

    function updateTab(sub, pct) {
      const tab = document.querySelector(`.tab[data-sub="${sub}"]`);
      if (!tab) return;
      const sm = tab.querySelector("small");
      if (sm) sm.textContent = pct + "%";
      else tab.insertAdjacentHTML("beforeend", ` <small>${pct}%</small>`);
    }

    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        subject = t.dataset.sub;
        render();
      };
    });

    if (localStorage.user) { auth.style.display = "none"; render(); }
    lucide.createIcons();
  </script>
</body>

</html>
