<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Study Tracker Assam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/lucide@latest"></script>

 <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  doc, getDoc, updateDoc, deleteDoc,
  query, where, onSnapshot, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* ---------- FIREBASE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyC4p3HnfZ0_e-8ghcHYo1FG4u-ywfGv3L8",
  authDomain: "study-b5df9.firebaseapp.com",
  projectId: "study-b5df9",
  storageBucket: "study-b5df9.firebasestorage.app",
  messagingSenderId: "149030701226",
  appId: "1:149030701226:web:f94b25e63e0c4af9c728d3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userRef, userDocRef;
let editMode = false;

/* ---------- DATA ---------- */
const chapters = {
  Physics: ["Kinematics", "NLM", "Rotation"],
  Chemistry: ["Bonding", "Thermodynamics"],
  Mathematics: ["Limits", "Integration"]
};

/* ---------- UTILS ---------- */
const fill = (id, a) => {
  const e = document.getElementById(id);
  e.innerHTML = "";
  a.forEach(v => e.add(new Option(v, v)));
};
const toMin = (h, m, ap) => {
  h = parseInt(h); m = parseInt(m);
  if (ap === "PM" && h !== 12) h += 12;
  if (ap === "AM" && h === 12) h = 0;
  return h * 60 + m;
};
const weekLabel = d =>
  `${new Date(d).toLocaleString("en",{month:"long"})} ${Math.ceil(new Date(d).getDate()/7)} Week`;
const daysBetween = (a,b)=>Math.ceil((b-a)/86400000);

/* ---------- INIT ---------- */
window.onload = async () => {
  const s = JSON.parse(localStorage.getItem("user"));

  /* ===== AUTH ===== */
  if (!s) {
    authBox.style.display = "flex";
    document.body.classList.add("auth-active");

    loginTab.onclick = () => {
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      loginForm.style.display = "flex";
      registerForm.style.display = "none";
    };

    registerTab.onclick = () => {
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      registerForm.style.display = "flex";
      loginForm.style.display = "none";
    };

    loginBtn.onclick = async () => {
      const q = query(
        collection(db,"users"),
        where("loginKey","==",loginUser.value),
        where("password","==",loginPassword.value)
      );
      const snap = await getDocs(q);
      if (snap.empty) return alert("Invalid credentials");

      localStorage.setItem("user", JSON.stringify({
        uid: snap.docs[0].id,
        name: snap.docs[0].data().name
      }));
      location.reload();
    };

    registerBtn.onclick = async () => {
      const d = await addDoc(collection(db,"users"),{
        name: regName.value,
        username: regUser.value,
        phone: regPhone.value,
        loginKey: regUser.value,
        password: regPassword.value,
        createdAt: serverTimestamp()
      });
      localStorage.setItem("user", JSON.stringify({uid:d.id,name:regName.value}));
      location.reload();
    };

    return;
  }

  /* ===== LOGGED IN ===== */
  document.body.classList.remove("auth-active");
  userName.textContent = s.name;

  userRef = collection(db,"users",s.uid,"entries");
  userDocRef = doc(db,"users",s.uid);

  fill("sh",[...Array(12)].map((_,i)=>String(i+1).padStart(2,"0")));
  fill("eh",[...Array(12)].map((_,i)=>String(i+1).padStart(2,"0")));
  fill("sm",[...Array(60)].map((_,i)=>String(i).padStart(2,"0")));
  fill("em",[...Array(60)].map((_,i)=>String(i).padStart(2,"0")));
  fill("sap",["AM","PM"]);
  fill("eap",["AM","PM"]);

  subject.onchange = () => {
    chapter.innerHTML = "<option value=''>Chapter</option>";
    (chapters[subject.value]||[]).forEach(c=>chapter.add(new Option(c,c)));
  };

  save.onclick = async () => {
    const s1 = toMin(sh.value,sm.value,sap.value);
    const e1 = toMin(eh.value,em.value,eap.value);
    if (e1<=s1) return alert("Invalid time");

    await addDoc(userRef,{
      subject: subject.value,
      chapter: chapter.value,
      date: date.value,
      hours: (e1-s1)/60,
      createdAt: serverTimestamp()
    });
  };

  logout.onclick = () => {
    localStorage.removeItem("user");
    location.reload();
  };

  profileBtn.onclick = () => profilePage.style.display="flex";
  closeProfile.onclick = () => profilePage.style.display="none";

  editProfile.onclick = () => {
    editMode = !editMode;
    setEditable(editMode);
  };

  saveProfile.onclick = async () => {
    await updateDoc(userDocRef,{
      name: pName.value,
      username: pUsername.value,
      phone: pPhone.value,
      targetTitle: pTarget.value,
      targetStart: targetStart.value,
      targetEnd: targetEnd.value
    });
    userName.textContent = pName.value;
    updateProgress(targetStart.value,targetEnd.value);
    editMode=false;
    setEditable(false);
  };

  resetData.onclick = resetUserData;

  loadProfile();
  startRealtime();
  lucide.createIcons();
};

/* ---------- PROFILE ---------- */
async function loadProfile(){
  const u=(await getDoc(userDocRef)).data();
  pName.value=u.name||"";
  pUsername.value=u.username||"";
  pPhone.value=u.phone||"";
  pTarget.value=u.targetTitle||"";
  targetStart.value=u.targetStart||"";
  targetEnd.value=u.targetEnd||"";
  setEditable(false);
  if(u.targetStart&&u.targetEnd) updateProgress(u.targetStart,u.targetEnd);
}

function setEditable(v){
  [pName,pUsername,pPhone,pTarget,targetStart,targetEnd].forEach(i=>i.disabled=!v);
  saveProfile.style.display=v?"inline-flex":"none";
}

function updateProgress(s,e){
  const st=new Date(s), en=new Date(e), now=new Date();
  const total=daysBetween(st,en);
  const done=Math.max(0,daysBetween(st,now));
  const left=Math.max(0,total-done);
  progBar.style.width=Math.min(100,(done/total)*100)+"%";
  progText.textContent=`${pTarget.value||"Target"} • Day ${done} • ${left} days left`;
}

/* ---------- RESET DATA ---------- */
async function resetUserData(){
  if(!confirm("This will permanently delete ALL your study data. Continue?")) return;
  const snap = await getDocs(userRef);
  await Promise.all(
    snap.docs.map(d =>
      deleteDoc(doc(db,"users",
        JSON.parse(localStorage.getItem("user")).uid,
        "entries",
        d.id))
    )
  );
  alert("All study data deleted.");
}

/* ---------- REALTIME ---------- */
function startRealtime(){
  const q=query(userRef,orderBy("createdAt","desc"));
  onSnapshot(q,snap=>{
    right.innerHTML="";
    let total=0,week=0,today=0;
    const now=new Date().toISOString().slice(0,10);
    const sub={Physics:0,Chemistry:0,Mathematics:0};
    const grp={};

    snap.forEach(d=>{
      const x=d.data();
      total+=x.hours;
      sub[x.subject]+=x.hours;
      if(x.date===now) today+=x.hours;
      if(Math.abs(new Date(x.date)-new Date())<7*864e5) week+=x.hours;
      (grp[weekLabel(x.date)]??=[]).push(x);
    });

    Object.entries(grp).forEach(([l,it])=>{
      right.innerHTML+=`<div class="group">${l}</div>`;
      it.forEach(x=>{
        right.innerHTML+=`
          <div class="entry">
            <span>${x.subject} • ${x.chapter}</span>
            <b>${x.hours.toFixed(2)}h</b>
          </div>`;
      });
    });

    totalEl.textContent=total.toFixed(2)+"h";
    weekEl.textContent=week.toFixed(2)+"h";
    todayEl.textContent=today.toFixed(2)+"h";
    phyEl.textContent=sub.Physics.toFixed(2)+"h";
    chemEl.textContent=sub.Chemistry.toFixed(2)+"h";
    mathEl.textContent=sub.Mathematics.toFixed(2)+"h";
  });
}
</script>


  <style>
    :root {
      --pri: #2563eb;

    .nav {

    }

    .brand {
      display: flex;

    }

    /* APP LAYOUT FIX */
    .app {
      height: calc(100vh - 48px);

    }

    /* LEFT PANEL FIX */
    .left {
      width: 40vw;

      border-radius: 18px;

    }

      flex: 1;

    /* STATS */
    .stats {

      grid-template-columns: repeat(6, 1fr);

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 8px;
      transition: .2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #0001
    }

    .card small {
      font-size: 10px;
      color: #64748b
    }

    .card h2 {
      margin: 2px 0 0;
      font-size: 14px
    }

    /* PROGRESS */
    .progress {
      height: 6px;
      background: #dbeafe;
      border-radius: 4px
    }

    .progress span {
      height: 100%;
      display: block;
      background: var(--pri)
    }

    /* FORM */
    .form {
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      gap: 6px;
      flex: 1;
    }

    label {
      font-size: 10px;
      color: #64748b
    }

    .row3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px
    }

    select,
    input {
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 11px;
    }

    button {
      padding: 8px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--pri), #38bdf8);
      color: #fff;
      font-weight: 600;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px #2563eb55
    }

    /* ENTRIES */
    .group {
      font-weight: 700;
      margin: 4px 0
    }

    .entry {
      background: var(--card);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      transition: .2s;
    }

    .entry:hover {
      background: #eef2ff
    }
    /* ================= PROFILE MODAL ================= */

.profile {
  position: fixed;

  display: none;
  align-items: center;

}

/* Modal card */

}

/* Header */
.profile-top {

}

.profile-top h2 {
  font-size: 18px;

}

/* Header action buttons */
.profile-actions {
  display: flex;

}

/* Icon buttons (pencil & close) */
.profile-icon {
  width: 38px;

  justify-content: center;

  background: rgba(255, 255, 255, 0.9);

  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  transition: all 0.2s ease;
}

.profile-icon svg {
  width: 18px;
  height: 18px;
}

.profile-icon:hover {
  transform: scale(1.08);
  background: #ffffff;
}

/* Close button danger hint */
#closeProfile:hover {
  background: #fee2e2;
  color: #b91c1c;
}
    .section {
